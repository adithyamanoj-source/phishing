{% extends 'base.html' %}

{% block content %}
<div style="max-width: 440px; margin: 2rem auto 3rem auto;">
    <div class="dash-card">
        
        <div style="text-align: center; margin-bottom: 1.75rem;">
            <div style="width: 54px; height: 54px; border-radius: 14px; background: var(--color-primary-light); color: var(--color-primary); display: inline-flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-bottom: 1rem;">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h2 style="font-size: 1.6rem; color: var(--text-dark); margin-bottom: 0.25rem;">Create Account</h2>
            <p style="color: var(--text-secondary); font-size: 0.875rem;">Start auditing suspicious URLs and SMS text messages securely.</p>
        </div>

        <form action="/register" method="POST" id="register-form" onsubmit="return validateRegisterForm(event)">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}">

            <div class="form-group">
                <label class="form-label" for="reg-email">Email Address</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope input-icon"></i>
                    <input type="email" class="form-input has-icon" id="reg-email" name="email" placeholder="name@company.com" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="reg-password">Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-key input-icon"></i>
                    <input type="password" class="form-input has-icon" id="reg-password" name="password" placeholder="••••••••" required oninput="checkPasswordStrength()" style="padding-right: 3rem;">
                    <button type="button" onclick="togglePasswordVisibility('reg-password', this)" style="position: absolute; right: 1rem; background: transparent; border: none; color: var(--text-muted); cursor: pointer;">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
                
                <div style="margin-top: 0.5rem; height: 4px; background: #e2e8f0; border-radius: 2px; overflow: hidden;">
                    <div id="password-strength-bar" style="width: 0%; height: 100%; transition: width 0.3s ease, background 0.3s ease;"></div>
                </div>
                <div id="password-strength-text" style="font-size: 0.78rem; color: var(--text-muted); margin-top: 0.25rem;">Min. 8 characters with letters and numbers</div>
            </div>

            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label class="form-label" for="reg-password-confirm">Confirm Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" class="form-input has-icon" id="reg-password-confirm" name="password_confirm" placeholder="••••••••" required style="padding-right: 3rem;">
                    <button type="button" onclick="togglePasswordVisibility('reg-password-confirm', this)" style="position: absolute; right: 1rem; background: transparent; border: none; color: var(--text-muted); cursor: pointer;">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem;">
                <i class="fa-solid fa-user-plus"></i> Create Free Account
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.75rem; border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
            <p style="color: var(--text-secondary); font-size: 0.875rem;">
                Already have an account? <a href="/login" style="font-weight: 700; color: var(--color-primary); text-decoration: none;">Sign in instead</a>
            </p>
        </div>

    </div>
</div>
{% endblock %}
